<text x="620" y="120" fill="#43c47e" text-anchor="middle" font-size="11">then back left along the top row (LEDs 24-47)</text>
<text x="620" y="276" fill="#43c47e" text-anchor="middle" font-size="11">data flows right along the bottom row (LEDs 0-23)</text>
<text x="320" y="86" fill="#f0974a" font-size="12">now (hour 0)</text>
<text x="917" y="86" fill="#f0974a" text-anchor="end" font-size="12">+23 h</text>
<text x="945" y="151.0" fill="#e8eae9" font-size="12">top row: temperature</text>
<text x="945" y="167.0" fill="#9aa3a1" font-size="11">hour 0 at left = LED 47</text>
<text x="945" y="235.0" fill="#e8eae9" font-size="12">bottom row: conditions</text>
<text x="945" y="251.0" fill="#9aa3a1" font-size="11">hour 0 at left = LED 0</text>
<rect x="320" y="340" width="170" height="64" rx="10" fill="#2a2f2d" stroke="#3d4442"/>
<text x="405.0" y="370" fill="#e8eae9" text-anchor="middle" font-weight="600">5V supply, 3A</text>
<text x="405.0" y="388" fill="#9aa3a1" text-anchor="middle" font-size="11">to the strip 5V and GND pads</text>
