<path d="M360,340 V284" stroke="#e5533d" stroke-width="2.5" fill="none"/>
<text x="368" y="306" fill="#e5533d" font-size="11">5V</text>
<circle cx="390" cy="340" r="5" fill="#9a9e9c"/>
<path d="M390,340 V284" stroke="#9a9e9c" stroke-width="2.5" fill="none"/>
<text x="398" y="306" fill="#9a9e9c" font-size="11">GND</text>
<text x="520" y="354" fill="#9aa3a1" font-size="12">One common ground: ESP32 GND and supply GND both land on the strip.</text>
<text x="520" y="372" fill="#9aa3a1" font-size="12">Optional but cheap insurance: 330-470 ohm in series on DIN, 1000 uF across 5V/GND at the strip.</text>
<text x="520" y="390" fill="#9aa3a1" font-size="12">Full white on 48 LEDs is about 2.9 A. The forecast never renders white; typical draw is under 1 A.</text>
<text x="520" y="408" fill="#9aa3a1" font-size="12">Wired LED 0 in a different corner, or without the snake? Set it in the dashboard tab (Edges > Strip wiring).</text>
