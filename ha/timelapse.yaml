# Append to scripts.yaml. Fakes a 24h timelapse on the wall: publishes a
# rotated 24-hour window to weather/hourly every hold_seconds so the whole
# strip shifts one LED left per frame, then restores the real forecast.
# The 15-minute publisher automation carries a condition that skips while this
# script is running, so cancelling mid-run leaves nothing to clean up (the next
# tick, or a manual run of script.weather_display_update, restores the wall).
# Optional: animations=false disables the device's three effects for the run
# (via script.edgelight_apply) and re-enables them after. Needs the helper
# input_boolean.edgelight_timelapse_animations for the dashboard toggle.
# Firmware needs no change.
#
# Row format matches weather_display_publish.py:
#   [temp_bucket, cond_code, is_night, precip_bucket, wind_bucket, temperature_f]
# Hour index = local clock hour. Night flag 20:00-06:59 to match the publisher.

edgelight_fake_timelapse:
  alias: Edgelight - Fake 24h timelapse
  description: Walk the wall through a scripted day, one hour per frame, then restore the real forecast.
  icon: mdi:movie-open-play
  mode: single
  fields:
    hold_seconds:
      name: Seconds per frame
      default: 5
      selector:
        number:
          min: 1
          max: 60
    start_hour:
      name: Start hour
      description: Clock hour shown on the leftmost LED in the first frame (0-23).
      default: 0
      selector:
        number:
          min: 0
          max: 23
    cycles:
      name: Cycles
      description: How many full 24-frame loops to run.
      default: 1
      selector:
        number:
          min: 1
          max: 10
    animations:
      name: Wall animations
      description: >-
        Keep breathing, wind shimmer and lightning during the loop. When off, the
        device's three effects are disabled for the run and re-enabled after.
        Defaults to input_boolean.edgelight_timelapse_animations.
      selector:
        boolean:
  variables:
    day:
      # Temperatures are met.no's real Boulder-area hourly forecast for
      # 2026-09-12/13 (local clock hour) with a pre-dawn cold pocket (02-07)
      # pushed down so two hours reach the blue end; conditions layered to suit.
      - [4, 3, 1, 1, 2, 54]    # 00 partly cloudy
      - [4, 3, 1, 1, 2, 54]    # 01 partly cloudy
      - [3, 2, 1, 1, 2, 47]    # 02 clear night, radiative cooling
      - [3, 2, 1, 1, 2, 41]    # 03 clear night
      - [3, 7, 1, 2, 1, 34]    # 04 fog, cold pocket (blue)
      - [2, 7, 1, 2, 1, 31]    # 05 fog, coldest hour (blue)
      - [3, 4, 1, 2, 2, 39]    # 06 cloudy
      - [3, 3, 0, 1, 2, 48]    # 07 partly cloudy (sunrise)
      - [4, 1, 0, 1, 2, 59]    # 08 sunny
      - [5, 1, 0, 1, 2, 71]    # 09 sunny
      - [5, 1, 0, 1, 2, 75]    # 10 sunny
      - [6, 1, 0, 1, 3, 78]    # 11 sunny, breeze
      - [6, 3, 0, 1, 3, 79]    # 12 partly cloudy
      - [6, 3, 0, 3, 3, 80]    # 13 partly cloudy, cumulus building
      - [6, 4, 0, 5, 5, 80]    # 14 cloudy, gust front
      - [5, 11, 0, 9, 7, 71]   # 15 thunderstorm, outflow drop
      - [5, 11, 0, 8, 6, 71]   # 16 thunderstorm
      - [5, 8, 0, 7, 4, 67]    # 17 rain
      - [4, 8, 0, 6, 4, 59]    # 18 rain
      - [4, 4, 0, 3, 3, 59]    # 19 cloudy (sunset)
      - [4, 3, 1, 1, 2, 56]    # 20 partly cloudy
      - [4, 2, 1, 1, 2, 56]    # 21 clear night
      - [4, 2, 1, 1, 2, 56]    # 22 clear night
      - [4, 3, 1, 1, 2, 54]    # 23 partly cloudy
  sequence:
    - variables:
        keep_effects: >-
          {{ animations if animations is defined
             else is_state('input_boolean.edgelight_timelapse_animations', 'on') }}
        cfg: "{{ state_attr('sensor.edgelight_configuration', 'config') }}"
        orig_anim: "{{ cfg.animations if cfg is mapping else none }}"
    - if: "{{ not keep_effects and orig_anim is mapping }}"
      then:
        - variables:
            rev: "{{ state_attr('sensor.edgelight_configuration', 'revision') | int }}"
        - action: script.edgelight_apply
          data:
            command:
              id: "tl-off-{{ now().strftime('%Y%m%d%H%M%S') }}"
              expectedRevision: "{{ rev }}"
              config: >-
                {{ dict(cfg, animations=dict(orig_anim,
                     breathing=dict(orig_anim.breathing, enabled=false),
                     wind=dict(orig_anim.wind, enabled=false),
                     lightning=dict(orig_anim.lightning, enabled=false))) }}
        - wait_template: "{{ state_attr('sensor.edgelight_configuration', 'revision') | int > rev }}"
          timeout: "00:00:10"
          continue_on_timeout: true
    - repeat:
        count: "{{ (cycles | default(1) | int) * 24 }}"
        sequence:
          - variables:
              k: "{{ ((start_hour | default(0) | int) + repeat.index - 1) % 24 }}"
              frame: "{{ day[k:] + day[:k] }}"
              times: >-
                {% set ns = namespace(t=[]) %}
                {% set base = now().replace(minute=0, second=0, microsecond=0) %}
                {% for i in range(24) %}{% set ns.t = ns.t + [(base + timedelta(hours=i)).isoformat()] %}{% endfor %}
                {{ ns.t }}
          - action: mqtt.publish
            data:
              topic: weather/hourly
              payload: "{{ {'h': frame, 'times': times, 'generated_at': now().isoformat(), 'timelapse_hour': k} | to_json }}"
              qos: 0
              retain: false
          - delay:
              seconds: "{{ hold_seconds | default(5) | int }}"
    - if: "{{ not keep_effects and orig_anim is mapping }}"
      then:
        - variables:
            rev: "{{ state_attr('sensor.edgelight_configuration', 'revision') | int }}"
        - action: script.edgelight_apply
          data:
            command:
              id: "tl-on-{{ now().strftime('%Y%m%d%H%M%S') }}"
              expectedRevision: "{{ rev }}"
              config: "{{ dict(state_attr('sensor.edgelight_configuration', 'config'), animations=orig_anim) }}"
        - wait_template: "{{ state_attr('sensor.edgelight_configuration', 'revision') | int > rev }}"
          timeout: "00:00:10"
          continue_on_timeout: true
    - action: script.weather_display_update

edgelight_timelapse_restore:
  alias: Edgelight - Restore wall after timelapse
  description: Re-enable any disabled wall effects and republish the real forecast. Safe to run any time.
  icon: mdi:restore
  mode: single
  sequence:
    - variables:
        cfg: "{{ state_attr('sensor.edgelight_configuration', 'config') }}"
        an: "{{ cfg.animations if cfg is mapping else none }}"
        rev: "{{ state_attr('sensor.edgelight_configuration', 'revision') | int(0) }}"
    - if: "{{ an is mapping and not (an.breathing.enabled and an.wind.enabled and an.lightning.enabled) }}"
      then:
        - action: script.edgelight_apply
          data:
            command:
              id: "tl-restore-{{ now().strftime('%Y%m%d%H%M%S') }}"
              expectedRevision: "{{ rev }}"
              config: >-
                {{ dict(cfg, animations=dict(an,
                     breathing=dict(an.breathing, enabled=true),
                     wind=dict(an.wind, enabled=true),
                     lightning=dict(an.lightning, enabled=true))) }}
        - wait_template: "{{ state_attr('sensor.edgelight_configuration', 'revision') | int > rev }}"
          timeout: "00:00:10"
          continue_on_timeout: true
    - action: script.weather_display_update
