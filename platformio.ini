; PlatformIO config for the FastLED weather display.
; Target: generic ESP32 dev board (esp32dev). Adjust `board` if you have a
; different module (e.g. esp32-s3-devkitc-1, esp32-c3-devkitm-1).

[platformio]
extra_configs = platformio_local.ini

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
  fastled/FastLED@^3.7.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.4

build_flags =
  -DCORE_DEBUG_LEVEL=1

; OTA target. Use after one USB flash installs the ArduinoOTA listener.
;   pio run -e esp32dev-ota -t upload
; Set upload_port to your device's IP. espota over mDNS (.local) is flaky on
; macOS, so pin the IP and reserve it in your router's DHCP table.
; To keep your IP out of git, put the override in platformio_local.ini
; (gitignored):
;   [env:esp32dev-ota]
;   upload_port = 192.168.1.50
[env:esp32dev-ota]
extends         = env:esp32dev
upload_protocol = espota
upload_port     = 192.168.1.50
